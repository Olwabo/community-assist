name: community_assist
description: "CommunityAssist: Community Incident Reporting and Assistance Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.1.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0

  # Location & Camera
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  image: ^4.2.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1

  # State management
  provider: ^6.1.5

  # UI helpers
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1

  # Permissions
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21